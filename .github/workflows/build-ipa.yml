name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Web Assets & Install Capacitor
        run: |
          if [ ! -f package.json ]; then
            echo '{"name": "school-escape", "version": "1.0.0", "private": true}' > package.json
          fi
          
          mkdir -p www
          find . -maxdepth 1 -type f ! -name "package*.json" ! -name "capacitor.config.json" -exec cp {} www/ \;
          if [ -d "assets" ]; then cp -r assets www/ || true; fi
          if [ -d "css" ]; then cp -r css www/ || true; fi
          if [ -d "js" ]; then cp -r js www/ || true; fi
          
          npm install @capacitor/core @capacitor/cli @capacitor/ios --yes
          
          echo '{"appId": "com.schoolescape.app", "appName": "SchoolEscape", "webDir": "www"}' > capacitor.config.json
          
          npx --yes cap add ios
          
          # Підвищуємо версію iOS в Podfile
          sed -i '' "s/platform :ios, '.*'/platform :ios, '13.0'/g" ios/App/Podfile || true
          
          npx --yes cap update ios
          npx --yes cap copy

      - name: Build Xcode Archive
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -archivePath build/App.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Export Unsigned IPA
        run: |
          cd ios/App
          mkdir -p build/ipa/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app build/ipa/Payload/
          cd build/ipa
          zip -r ../SchoolEscape.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SchoolEscape-IPA
          path: ios/App/build/SchoolEscape.ipa
