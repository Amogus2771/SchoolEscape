name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Capacitor & Setup Config
        run: |
          if [ ! -f package.json ]; then
            echo '{"name": "school-escape", "version": "1.0.0", "private": true}' > package.json
          fi
          
          npm install @capacitor/core @capacitor/cli @capacitor/ios --yes
          
          if [ ! -f capacitor.config.json ]; then
            echo '{"appId": "com.schoolescape.app", "appName": "SchoolEscape", "webDir": "."}' > capacitor.config.json
          fi
          
          npx --yes cap add ios
          npx --yes cap copy

      - name: Build Xcode Archive
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -archivePath build/App.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Export Unsigned IPA
        run: |
          cd ios/App
          mkdir -p build/ipa/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app build/ipa/Payload/
          cd build/ipa
          zip -r ../SchoolEscape.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SchoolEscape-IPA
          path: ios/App/build/SchoolEscape.ipa
